# ==============================================================================
# 「Clash」
#  [橙子橙汁]
# ==============================================================================

# [基础设置]
# 1. 基础连接与端口配置
port: 7890
socks-port: 7891
redir-port: 7892        # 与原本 mixed-port 冲突，此处固定为重定向端口
tproxy-port: 7895       # TProxy 端口
mixed-port: 7893        # 将原本 7892 修改为 7893，避免端口占用冲突
allow-lan: true         # 允许局域网连接
bind-address: "*"       # 监听所有网卡
mode: rule              # 规则模式
log-level: info         # 日志等级
ipv6: false             # 禁用 IPv6

# 2. 外部控制与 UI 面板 (针对 OpenWrt 路径优化)
# 将控制地址改为 0.0.0.0 以便从电脑浏览器访问手机或路由器的 9090 端口
external-controller: 127.0.0.1:9090
secret: "7355608"       # 你的原始密钥

# 3. 性能与连接优化
unified-delay: true     # 统一延迟计算
tcp-concurrent: true    # TCP 并发连接
global-client-fingerprint: chrome # 全局指纹模拟
keep-alive-interval: 15
keep-alive-idle: 600
geox-url: {}

profile: # 记忆选中的节点
  store-selected: true


# 4. 流量嗅探 (Sniffer) - 解决流媒体分流与 Fake-IP 还原
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  sniff:
    QUIC:
      ports: [443]
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"

dns:
  enable: true
  enhanced-mode: fake-ip   # 必须使用 fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:1053
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  proxy-server-nameserver:
    - 119.29.29.29

tun:
  enable: true
  stack: system            # Windows/Android 推荐 system，macOS 推荐 gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - "any:53"             # 劫持所有 DNS 请求
    - "tcp://any:53"
  
  # 2. 代理服务器域名解析：防止解析代理节点域名时发生泄露
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  
  # 3. 默认解析服务器：主要负责国内域名
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  
  # 4. 关键：分流解析政策 (DNS 泄露的终结者)
  # 强制让国外/特定服务走加密 DNS 且通过代理，或者直接交给 fake-ip 逻辑
  nameserver-policy:
    "geosite:cn": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:geolocation-!cn": [https://dns.google/dns-query, https://1.1.1.1/dns-query]
    "+.google.com,+.googleapis.com,+.gstatic.com": [https://8.8.8.8/dns-query]
    "+.facebook.com,+.instagram.com,+.twitter.com": [https://1.1.1.1/dns-query]
    
  fake-ip-filter: # 完整保留你原本的所有过滤域名
    - '+.lan'
    - '+.local'
    - 'stun.*'
    - 'ntp.*'
    - '+.pool.ntp.org'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '+.sony.com'
    - '+.n.shifen.com'
    - 'msftconnecttest.com'
    - 'workplace.com'
    - '+.tencent.com'
    - '+.qq.com'
    - '+.weixin.com'
    - '+.wechat.com'
    - '+.qlogo.cn'
    - '+.qpic.cn'
    - '+.gtimg.cn'
    - '+.alipay.com'
    - '+.taobao.com'
    - '+.tmall.com'
    - '+.alicdn.com'
    - '+.aliyun.com'
    - '+.baidu.com'
    - '+.bdstatic.com'
    - '+.douyin.com'
    - '+.amemv.com'
    - '+.pstatp.com'
    - '+.jd.com'
    - '+.xiaomi.com'
    - '+.mi-img.com'
    - 'short.weixin.qq.com'
    - 'szshort.weixin.qq.com'
    - 'mars.weixin.qq.com'
    - 'long.weixin.qq.com'
    - 'extshort.weixin.qq.com'
    - 'minorshort.weixin.qq.com'
    - 'szextshort.weixin.qq.com'
    - 'szminorshort.weixin.qq.com'
    - 'support.weixin.qq.com'
    - 'wechatos.net'
    - '+.weixin.qq.com'

# [外部节点订阅]
proxy-providers:
  Airport_A:
    type: http
    url: '订阅链接'
    interval: 86400
    header:
      User-Agent: ["ClashMeta", "Mihomo", "Clash"]  #UA身份伪装
    health-check: {enable: true, url: 'http://connectivitycheck.gstatic.com/generate_204', interval: 600}
    
# [策略组]
# 1. 国家/地区正则定义
FilterHK: &FilterHK '(?i)香港|HK|Hong Kong'
FilterTW: &FilterTW '(?i)台湾|TW|Taiwan'
FilterJP: &FilterJP '(?i)日本|JP|Japan'
FilterKR: &FilterKR '(?i)韩国|KR|Korea'
FilterUS: &FilterUS '(?i)美国|US|United States'
FilterSG: &FilterSG '(?i)新加坡|SG|Singapore'
FilterCA: &FilterCA '(?i)加拿大|CA|Canada'
FilterUK: &FilterUK '(?i)英国|UK|United Kingdom'
FilterAQ: &FilterAQ '(?i)南极洲|AQ|Antarctica'
FilterMO: &FilterMO '(?i)澳门|MO|Macau'
FilterNL: &FilterNL '(?i)荷兰|NL|Netherlands'
FilterDE: &FilterDE '(?i)德国|DE|Germany'
