# [第七部分：规则分流逻辑]
rules:
    #屏蔽 QUIC 协议
  #- AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  
    # NotebookLM 专项优化
  - DOMAIN-SUFFIX,notebooklm.google,NotebookLM
  - DOMAIN,notebooklm.google,NotebookLM
  - DOMAIN-SUFFIX,notebook-static.google,NotebookLM
  - DOMAIN,content-notebooklm.googleapis.com,NotebookLM
  - DOMAIN-KEYWORD,notebooklm,NotebookLM
  
    # steam下载直连
  - DOMAIN-KEYWORD,steamcontent,DIRECT
  - DOMAIN-SUFFIX,cm.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamstatic.com,DIRECT
  
    # 应用规则分流
  - RULE-SET,Gemini,AI_Service,no-resolve
  - RULE-SET,OpenAI,AI_Service,no-resolve
  - RULE-SET,Telegram,Telegram,no-resolve
  - RULE-SET,TikTok,TikTok,no-resolve
  - RULE-SET,BilibiliHMT,Bilibili,no-resolve
  - RULE-SET,YouTube,YouTube,no-resolve
  - RULE-SET,youtube-music,YouTube,no-resolve
  - RULE-SET,Instagram,社交媒体,no-resolve
  - RULE-SET,Facebook,社交媒体,no-resolve
  - RULE-SET,Twitter,社交媒体,no-resolve
  - RULE-SET,WhatsApp,社交媒体,no-resolve
  
    # 游戏规则分流
  - RULE-SET,GameRule,Game,no-resolve
  - RULE-SET,Honor of kings,Game,no-resolve
  
    # 系统规则分流
  - DOMAIN,aida.googleapis.com,Android,no-resolve
  - RULE-SET,Google,Android,no-resolve
  - RULE-SET,Apple,Apple,no-resolve
  - RULE-SET,Microsoft,Microsoft,no-resolve
  - RULE-SET,FCM_Rule,Android,no-resolve
  
    # 兜底
  - RULE-SET,china_ip,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,Proxy
